<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KSP</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main>
      <section class="grid">
        <!-- Liste Des Fusee Enregistrée -->
        <div
          class="block"
          id="liste-fusee"
          style="--grid-column: 1/6; --grid-row: 1/13"
        ></div>
        <!-- Enregistrée Une Nouvelle Fusee -->
        <div
          class="block"
          id="nouvelle-fusee"
          style="--grid-column: 1/21; --grid-row: 13/21"
        ></div>
        <!-- Feuille De Calcule Orbitaux -->
        <div
          class="block"
          id="calcul"
          style="--grid-column: 6/16; --grid-row: 1/13"
        ></div>
        <!-- Affichage Des Résultats -->
        <div
          class="block"
          id="resultat"
          style="--grid-column: 16/21; --grid-row: 1/13"
        ></div>
      </section>
    </main>
  </body>
</html>
